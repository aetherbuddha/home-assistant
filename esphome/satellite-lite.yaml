# ==========================================================
# Satellite Lite — a lightweight voice assistant node for a
# smart home built with ESPHome, without audio output. It
# acts as a microphone node with visual status indication
# through an RGB LED.
#
# Features:
#   • Home Assistant voice assistant (Assist pipeline)
#   • Offline wake word detection (micro_wake_word)
#   • RGB LED status indication: idle, listening, speech,
#     processing, response, error, disconnected
#
# ----------------------------------------------------------
# Hardware platform
# ----------------------------------------------------------
#   Board:      Espressif ESP32-S3-WROOM-1-N16R8
#   Chipset:    ESP32-S3, dual-core, up to 240 MHz
#   Flash:      16 MB
#   PSRAM:      8 MB Octal, 80 MHz
#
# ----------------------------------------------------------
# Peripherals
# ----------------------------------------------------------
#   Microphone: INMP441 — digital I2S MEMS microphone,
#               24-bit, connected via I2S (GPIO15/16/17)
#
#   Indicator:  APA106 — addressable RGB LED,
#               connected to GPIO18
#
# ==========================================================

esphome:
  name: satellite_lite
  friendly_name: Satellite Lite
  on_boot:
    - script.execute: set_idle_led

esp32:
  variant: esp32s3

psram:
  mode: octal
  speed: 80MHZ

logger:

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    then:
      - micro_wake_word.start:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Satellite Fallback Hotspot
    password: !secret ap_password

captive_portal:

# ==========================================================
# I2S — Microphone (INMP441)
# GPIO15 = BCLK / SCK
# GPIO16 = LRCLK / WS
# GPIO17 = DATA / SD
# ==========================================================
i2s_audio:
  - id: i2s_in
    i2s_bclk_pin: GPIO15
    i2s_lrclk_pin: GPIO16

microphone:
  - platform: i2s_audio
    id: satellite_mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO17
    channel: left
    bits_per_sample: 32bit
    pdm: false

## ==========================================================
# RGB LED — Status indicator (APA106)
# ==========================================================
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO18
    num_leds: 1
    chipset: APA106
    channel_colors: GRB
    name: "Сателіт Статус LED"
    internal: true
    default_transition_length: 400ms

# ==========================================================
# Scripts
# ==========================================================
script:
  - id: set_idle_led               # Default white — idle state
    then:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 100%
          blue: 100%
          brightness: 42%

# ==========================================================
# Wake word detection
# ==========================================================
micro_wake_word:
  id: mww
  microphone:
    microphone: satellite_mic
  models:
    - model: alexa
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# ==========================================================
# Voice assistant
# ==========================================================
voice_assistant:
  id: va
  microphone: satellite_mic
  micro_wake_word: mww

  on_listening:                     # Green — listening
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 100%

  on_stt_vad_start:                 # Blue — user is speaking
    - light.turn_on:
        id: status_led
        red: 10%
        green: 30%
        blue: 100%
        brightness: 100%

  on_stt_vad_end:                   # Purple — speech recognition and LLM processing
    - light.turn_on:
        id: status_led
        red: 65%
        green: 10%
        blue: 100%
        brightness: 100%

  on_tts_end:                       # Amber — response is being played
    - light.turn_on:
        id: status_led
        red: 100%
        green: 70%
        blue: 0%
        brightness: 100%

  on_end:
    - script.execute: set_idle_led
    - delay: 300ms
    - micro_wake_word.start:

  on_error:                         # Red — error
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 100%

  on_client_connected:              # Home Assistant connected
    - script.execute: set_idle_led

  on_client_disconnected:           # Home Assistant disconnected — dim red
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 25%