# ==========================================================
# Satellite — a voice assistant for a smart home built with
# ESPHome, featuring offline wake word detection and a
# display showing voice assistant status and room climate data.
#
# Features:
#   • Home Assistant voice assistant (Assist pipeline)
#   • Offline wake word detection (micro_wake_word)
#   • Media playback and spoken responses with audio ducking
#     during voice interaction
#   • Color display with status-specific illustrations:
#     idle, listening, speaking, thinking, replying, error,
#     offline
#   • Room temperature and humidity monitoring
#
# ----------------------------------------------------------
# Hardware platform
# ----------------------------------------------------------
#   Board:      Espressif ESP32-S3-DevKitC-1-N16R8V
#   Chipset:    ESP32-S3, dual-core, up to 240 MHz
#   Flash:      16 MB Quad
#   PSRAM:      8 MB Octal, 80 MHz
#
# ----------------------------------------------------------
# Peripherals
# ----------------------------------------------------------
#   Microphone: INMP441 — digital I2S MEMS microphone,
#               24-bit, connected via I2S (GPIO15/16/17)
#
#   DAC:        PCM5102 — external I2S DAC,
#               stereo, 44.1 kHz, connected to GPIO4/5/6
#
#   Amplifier:  TPA3116D2 — stereo Class-D amplifier
#
#   Front speakers: Two AIYIMA 3" Bullet full-range speakers,
#                   4 Ω, 25 W
#
#   Passive radiators:
#   (Rear):          Two square AIYIMA 4" passive radiators
#                    for extended low-frequency response
#
#   Display:     ST7789V — IPS TFT, 320x170,
#                SPI interface (GPIO10/11/12, DC GPIO2, RST GPIO1)
#
#   Climate sensor: SHT45 — temperature and humidity,
#                   I2C interface (SDA GPIO8, SCL GPIO9)
#
# ----------------------------------------------------------
# Power supply
# ----------------------------------------------------------
#   24V rail:
#     External 24V 3A PSU, DC 5.5x2.1 mm connector
#       ├─→ TPA3116D2 (directly, through an inline fuse)
#       │     + 2x 2200 µF 35V (ECR222M35B) input capacitors
#       │       connected in parallel
#       └─→ MP1584EN (buck converter) → 5V rail
#
#   5V rail:
#     MP1584EN, 24V → 5V
#       ├─→ ESP32-S3-DevKitC-1 (board power)
#       └─→ PCM5102 (DAC)
#
#   3.3V rail:
#     (Generated by the ESP32-S3-DevKitC-1 onboard regulator)
#       ├─→ INMP441 (microphone)
#       ├─→ SHT45 (climate sensor)
#       └─→ ST7789V (display)
#
# ==========================================================

esphome:
  name: satellite
  friendly_name: Satellite
  on_boot:
    - script.execute: set_idle_display

esp32:
  variant: esp32s3

psram:
  mode: octal
  speed: 80MHZ

logger:

# ==========================================================
# Network: WiFi, API, OTA
# ==========================================================
api:
  encryption:
    key: !secret api_key
  on_client_connected:
    then:
      - micro_wake_word.start:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Satellite Fallback Hotspot
    password: !secret ap_password

captive_portal:

# ==========================================================
# I2C — Temperature and humidity sensor (SHT45)
# GPIO8 = SDA, GPIO9 = SCL
# ==========================================================
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

sensor:
  - platform: sht4x
    temperature:
      name: "Температура в кабінеті"
      id: satellite_temp_sensor
      on_value:
        then:
          - component.update: satellite_display
    humidity:
      name: "Вологість в кабінеті"
      id: satellite_hum_sensor
      on_value:
        then:
          - component.update: satellite_display
    update_interval: 60s

# ==========================================================
# I2S — Speaker (PCM5102) / Microphone (INMP441)
# ==========================================================
i2s_audio:
  - id: i2s_out
    i2s_bclk_pin: GPIO4
    i2s_lrclk_pin: GPIO5
  - id: i2s_in
    i2s_bclk_pin: GPIO15
    i2s_lrclk_pin: GPIO16

speaker:
  - platform: i2s_audio
    id: satellite_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO6
    channel: stereo
    sample_rate: 44100
    buffer_duration: 1000ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: satellite_speaker
    source_speakers:
      - id: media_mixer_input
        buffer_duration: 1000ms
      - id: announcement_mixer_input
        buffer_duration: 1000ms

media_player:
  - platform: speaker
    name: "Глас Божий"
    id: satellite_media_player
    media_pipeline:
      speaker: media_mixer_input
    announcement_pipeline:
      speaker: announcement_mixer_input

microphone:
  - platform: i2s_audio
    id: satellite_mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO17
    channel: left
    bits_per_sample: 32bit
    pdm: false

# ==========================================================
# Wake word detection
# ==========================================================
micro_wake_word:
  id: mww
  microphone:
    microphone: satellite_mic
  models:
    - model: alexa
  on_wake_word_detected:
    - mixer_speaker.apply_ducking:
        id: media_mixer_input
        decibel_reduction: 20
        duration: 0s
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# ==========================================================
# UI states: 0 idle, 1 listening, 2 speaking,
# 3 thinking, 4 replying, 5 error, 6 offline
# ==========================================================
globals:
  - id: ui_state
    type: int
    restore_value: no
    initial_value: '0'

# ==========================================================
# Scripts
# ==========================================================
script:
  - id: set_idle_display           # дефолтний білий — стан очікування
    then:
      - globals.set:
          id: ui_state
          value: '0'
      - component.update: satellite_display

# ==========================================================
# Voice assistant
# ==========================================================
voice_assistant:
  id: va
  microphone: satellite_mic
  media_player: satellite_media_player
  micro_wake_word: mww

  on_listening:                     # Green — listening
    - globals.set:
        id: ui_state
        value: '1'
    - component.update: satellite_display

  on_stt_vad_start:                 # Blue — user is speaking
    - globals.set:
        id: ui_state
        value: '2'
    - component.update: satellite_display

  on_stt_vad_end:                   # Purple — speech recognition and LLM processing
    - globals.set:
        id: ui_state
        value: '3'
    - component.update: satellite_display

  on_tts_end:                       # Amber — response is being played
    - globals.set:
        id: ui_state
        value: '4'
    - component.update: satellite_display

  on_end:
    - wait_until:                   # Wait for TTS playback to start
        condition:
          lambda: 'return id(satellite_speaker).is_running();'
        timeout: 5s
    - delay: 300ms
    - micro_wake_word.start:
    - mixer_speaker.apply_ducking:
        id: media_mixer_input
        decibel_reduction: 0
        duration: 1.5s
    - wait_until:                   # Wait for the conversation to end
        condition:
          lambda: 'return !id(va).is_running();'
        timeout: 10min
    - if:
        condition:
          lambda: 'return !id(va).is_running();'
        then:
          - script.execute: set_idle_display

  on_error:                         # Bright red — error
    - globals.set:
        id: ui_state
        value: '5'
    - component.update: satellite_display

  on_client_connected:              # Home Assistant connected
    - script.execute: set_idle_display

  on_client_disconnected:           # Home Assistant disconnected — dim red
    - globals.set:
        id: ui_state
        value: '6'
    - component.update: satellite_display

# ==========================================================
# SPI — Display (ST7789)
# ==========================================================
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

display:
  - platform: ili9xxx
    model: st7789v
    id: satellite_display
    cs_pin: GPIO10
    dc_pin: GPIO2
    reset_pin: GPIO1
    dimensions:
      width: 320
      height: 170
      offset_width: 0
      offset_height: 35
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    color_order: bgr
    invert_colors: true
    update_interval: never
    lambda: |-
      const int W = 320;
      const int H = 170;
      const int IMG = 170;
      Color line = Color(255, 255, 255);
      it.fill(Color::BLACK);
      switch (id(ui_state)) {
        case 1: it.image(0, 0, id(img_listening)); line = Color(0, 255, 0);   break;
        case 2: it.image(0, 0, id(img_speaking));  line = Color(0, 150, 255); break;
        case 3: it.image(0, 0, id(img_thinking));  line = Color(220, 0, 255); break;
        case 4: it.image(0, 0, id(img_replying));  line = Color(255, 179, 0); break;
        case 5: it.image(0, 0, id(img_error));     line = Color(255, 0, 0);   break;
        case 6: it.image(0, 0, id(img_offline));   line = Color(100, 0, 0);   break;
        default: it.image(0, 0, id(img_idle));     break;
      }
      const int rw = W - IMG;
      const int cx = IMG + rw / 2;
      const int len = rw * 3 / 4;
      const int T = 7;
      const int gap = 8;
      const int y0 = H / 2 - T / 2;
      it.filled_rectangle(cx - len / 2, y0, len, T, line);
      if (id(satellite_temp_sensor).has_state())
        it.printf(cx, y0 - gap, id(big_font), Color::WHITE, TextAlign::BOTTOM_CENTER, "%.1f°C", id(satellite_temp_sensor).state);
      if (id(satellite_hum_sensor).has_state())
        it.printf(cx, y0 + T + gap, id(big_font), Color::WHITE, TextAlign::TOP_CENTER, "%.0f%%", id(satellite_hum_sensor).state);

font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 20
    glyphs: "AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZzАБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯабвгґдеєжзиіїйклмнопрстуфхцчшщьюя 0123456789!?.,:;-°%"
  - file: "gfonts://Roboto"
    id: big_font
    size: 34
    glyphs: "0123456789°%.,CF-"

# ==========================================================
# Status images: /config/esphome/images/
# ==========================================================
image:
  - file: images/idle.png
    id: img_idle
    type: RGB565
    resize: 170x170
  - file: images/listening.png
    id: img_listening
    type: RGB565
    resize: 170x170
  - file: images/speaking.png
    id: img_speaking
    type: RGB565
    resize: 170x170
  - file: images/thinking.png
    id: img_thinking
    type: RGB565
    resize: 170x170
  - file: images/replying.png
    id: img_replying
    type: RGB565
    resize: 170x170
  - file: images/error.png
    id: img_error
    type: RGB565
    resize: 170x170
  - file: images/offline.png
    id: img_offline
    type: RGB565
    resize: 170x170