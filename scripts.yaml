dodati_posilku_17track:
  alias: Відстежити посилку
  description: Додає посилку в 17Track за ТТН і назвою
  fields:
    tracking_number:
      name: ТТН
      description: Номер накладної
      required: true
      selector:
        text:
    friendly_name:
      name: Що в коробці
      description: Назва посилки
      required: true
      selector:
        text:
  sequence:
  - action: seventeentrack.add_package
    data:
      config_entry_id: 01KX8SA1PVQ8DFSBPJH7QZ6ZGT
      package_tracking_number: '{{ tracking_number }}'
      package_friendly_name: '{{ friendly_name }}'
  mode: single
vidkryty_vorota:
  alias: Відкрити ворота
  sequence:
  - action: rest_command.osbb_open_gate
vidkryty_khvirtku:
  alias: Відкрити хвіртку
  sequence:
  - action: rest_command.osbb_open_wicket
vidkryty_smitnyk:
  alias: Відкрити смітник
  sequence:
  - action: rest_command.osbb_open_dump
tv_zapustiti_vtikalniu:
  alias: 'TV: Увімкнути заставку'
  sequence:
  - if:
    - condition: state
      entity_id: media_player.vitalnia_televizor
      state: 'off'
    then:
    - data:
        mac: 60:75:6C:AC:D8:5C
        broadcast_address: 192.168.0.255
      action: wake_on_lan.send_magic_packet
    - delay:
        hours: 0
        minutes: 0
        seconds: 8
        milliseconds: 0
  - target:
      entity_id: media_player.vitalnia_televizor
    data:
      command: system.launcher/launch
      payload:
        id: org.vitalii.aerialscreensaver2
    action: webostv.command
  mode: single
