- id: '1784060499333'
  alias: 'TV: Автопродовження сесії Developer Mode'
  description: Щопонеділка о 5:00 вмикає ТВ, продовжує сесію Developer Mode і вимикає
    назад
  triggers:
  - at: 05:00:00
    trigger: time
    weekday:
    - mon
  conditions:
  - condition: state
    entity_id: media_player.vitalnia_televizor
    state: 'off'
  actions:
  - data:
      mac: 60:75:6C:AC:D8:5C
      broadcast_address: 192.168.0.255
    action: wake_on_lan.send_magic_packet
  - delay:
      seconds: 12
  - target:
      entity_id: media_player.vitalnia_televizor
    data:
      source: Developer Mode
    action: media_player.select_source
  - delay:
      seconds: 5
  - target:
      entity_id: media_player.vitalnia_televizor
    data:
      button: DOWN
    action: webostv.button
  - delay:
      seconds: 1
  - target:
      entity_id: media_player.vitalnia_televizor
    data:
      button: DOWN
    action: webostv.button
  - delay:
      seconds: 1
  - target:
      entity_id: media_player.vitalnia_televizor
    data:
      button: DOWN
    action: webostv.button
  - delay:
      seconds: 1
  - target:
      entity_id: media_player.vitalnia_televizor
    data:
      button: DOWN
    action: webostv.button
  - delay:
      seconds: 1
  - target:
      entity_id: media_player.vitalnia_televizor
    data:
      button: ENTER
    action: webostv.button
  - delay:
      seconds: 5
  - target:
      entity_id: media_player.vitalnia_televizor
    action: media_player.turn_off
  mode: single
- id: '1784813937524'
  alias: 'Годівничка: Виявлено птаха'
  description: Надсилає на iPhone сповіщення з фото події Frigate
  triggers:
  - trigger: mqtt
    topic: frigate/reviews
  conditions:
  - condition: template
    value_template: "{{\n  trigger.payload_json.type == \"new\"\n  and trigger.payload_json.after.severity
      == \"alert\"\n  and trigger.payload_json.after.camera == \"birdwatcher\"\n  and
      \"bird\" in trigger.payload_json.after.data.objects\n  and (trigger.payload_json.after.data.detections
      | count) > 0\n}}"
  actions:
  - variables:
      review_id: '{{ trigger.payload_json.after.id }}'
      event_id: '{{ trigger.payload_json.after.data.detections[0] }}'
  - action: notify.mobile_app_korsun
    data:
      title: Птах біля годівнички
      message: Frigate виявив птаха. Натисніть, щоб відкрити фото.
      data:
        image: /api/frigate/notifications/{{ event_id }}/thumbnail.jpg
        url: /api/frigate/notifications/{{ event_id }}/snapshot.jpg
        tag: frigate-{{ review_id }}
        group: birdwatcher
  mode: queued
  max: 10
- id: '1784823863256'
  alias: 'Awtrix: Температура у вітальні'
  description: Надсилає температуру опалення вітальні на годинник Awtrix
  triggers:
  - entity_id:
    - sensor.vitalnia_peredpokii_temperatura
    trigger: state
  - minutes: /2
    trigger: time_pattern
  actions:
  - action: mqtt.publish
    data:
      topic: awtrix_b767cc/custom/studio_temp
      retain: false
      payload: "{\n  \"text\": \"{{ states('sensor.vitalnia_peredpokii_temperatura')
        | float(0) | round(0) }}°C\",\n  \"icon\": \"2355\",\n  \"pushIcon\": 0\n}"
  mode: restart
- id: '1784825146286'
  alias: 'Awtrix: Статус 3D-друку Bambu'
  description: Надсилає час до закінчення друку на годинник Awtrix у форматі ГГ:ХХ
  triggers:
  - entity_id: sensor.kabinet_bambu_lab_a1_chas_do_kintsia_druku
    trigger: state
  - minutes: /1
    trigger: time_pattern
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set s = states(''sensor.kabinet_bambu_lab_a1_chas_do_kintsia_druku'')
          %} {{ s in [''unknown'', ''unavailable'', ''none''] or (s | float(0)) <=
          0 }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: awtrix_b767cc/custom/bambu_print
          payload: ''
    - conditions:
      - condition: template
        value_template: '{% set s = states(''sensor.kabinet_bambu_lab_a1_chas_do_kintsia_druku'')
          %} {{ s not in [''unknown'', ''unavailable'', ''none''] and (s | float(0))
          > 0 }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: awtrix_b767cc/custom/bambu_print
          retain: false
          payload: "{% set total_hours = states('sensor.kabinet_bambu_lab_a1_chas_do_kintsia_druku')
            | float(0) %} {% set hours = total_hours | int %} {% set minutes = ((total_hours
            - hours) * 60) | round(0) | int %} {% set minutes_formatted = '{:02d}'.format(minutes)
            %} {\n  \"text\": \"{{ hours }}:{{ minutes_formatted }}\",\n  \"icon\":
            \"69827\",\n  \"pushIcon\": 0\n}"
  mode: restart
