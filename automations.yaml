- id: '1788369203459'
  alias: 'Awtrix: Статус прання'
  description: Надсилає час до закінчення прання на годинник Awtrix у форматі ГГ:ХХ
  triggers:
  - entity_id: sensor.pralka_remaining_time
    trigger: state
  - minutes: /1
    trigger: time_pattern
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set s = states(''sensor.pralka_remaining_time'') %} {{
          s in [''unknown'', ''unavailable'', ''none'', ''''] }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: awtrix_b767cc/custom/pralka
          payload: ''
    - conditions:
      - condition: template
        value_template: '{% set s = states(''sensor.pralka_remaining_time'') %} {{
          s not in [''unknown'', ''unavailable'', ''none'', ''''] }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: awtrix_b767cc/custom/pralka
          retain: false
          payload: "{% set s = states('sensor.pralka_remaining_time') %} {% set parts
            = s.split(':') %} {% set now_dt = now() %} {% set target = now_dt.replace(hour=parts[0]|int,
            minute=parts[1]|int, second=0, microsecond=0) %} {% if target < now_dt
            %}\n  {% set target = target + timedelta(days=1) %}\n{% endif %} {% set
            diff = (target - now_dt).total_seconds() %} {% if diff <= 60 %}\n  {%
            set payload_out = '' %}\n{% endif %} {% set hours = (diff // 3600) | int
            %} {% set minutes = ((diff % 3600) // 60) | int %} {\n  \"text\": \"{{
            hours }}:{{ '{:02d}'.format(minutes) }}\",\n  \"icon\": \"54246\",\n  \"pushIcon\":
            0\n}"
  mode: restart
